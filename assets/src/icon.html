<!doctype html>
<meta charset="utf-8">
<title>Frame Name Control icon</title>
<style>
  html, body { margin: 0; background: #111318; }
  svg { display: block; }
  text { font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; font-weight: 600; }
</style>
<!-- Render at 512 × 512, then scale to 128 × 128. Keys read ⌘ ⌥ F, the order the right hand meets them. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#111318"/>

  <!-- hidden name label and frame -->
  <rect x="70" y="82" width="150" height="36" rx="18" fill="#FFFFFF" opacity="0.26"/>
  <rect x="70" y="144" width="372" height="196" rx="24" fill="none" stroke="#FFFFFF" stroke-width="20"/>

  <!-- keys: ⌘ ⌥ F -->
  <g transform="translate(46 292)">
    <rect x="-10" y="-10" width="440" height="160" rx="40" fill="#111318"/>
    <g>
      <rect y="14" width="128" height="124" rx="30" fill="#B9BCC2"/>
      <rect width="128" height="124" rx="30" fill="#F4F4F2"/>
      <text x="64" y="86" text-anchor="middle" font-size="70" fill="#1A1C21">⌘</text>
    </g>
    <g transform="translate(146 0)">
      <rect y="14" width="128" height="124" rx="30" fill="#B9BCC2"/>
      <rect width="128" height="124" rx="30" fill="#F4F4F2"/>
      <text x="64" y="86" text-anchor="middle" font-size="70" fill="#1A1C21">⌥</text>
    </g>
    <g transform="translate(292 0)">
      <rect y="14" width="128" height="124" rx="30" fill="#0870C0"/>
      <rect width="128" height="124" rx="30" fill="#0D99FF"/>
      <text x="64" y="87" text-anchor="middle" font-size="72" fill="#FFFFFF">F</text>
    </g>
  </g>
</svg>
