name: Feedback / 피드백
description: Share an idea, a problem, or anything else about Frame Name Control. / 아이디어, 문제, 무엇이든 남겨 주세요.
title: "[Feedback] "
labels: ["feedback"]
body:
  - type: textarea
    id: message
    attributes:
      label: What would you like to share? / 남기고 싶은 내용
      description: Ideas, bugs, or anything that felt confusing. / 아이디어, 버그, 헷갈렸던 점 무엇이든 좋습니다.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Figma app and OS (optional) / Figma 앱과 운영체제 (선택)
      placeholder: e.g. Figma desktop on macOS 15
