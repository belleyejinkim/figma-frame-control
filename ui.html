<meta charset="utf-8">
<title>Frame Name Control</title>
<style>
  :root {
    --bg: var(--figma-color-bg, #ffffff);
    --bg-soft: var(--figma-color-bg-secondary, #f5f5f5);
    --bg-hover: var(--figma-color-bg-hover, #ebebeb);
    --text: var(--figma-color-text, #1e1e1e);
    --text-2: var(--figma-color-text-secondary, #767676);
    --border: var(--figma-color-border, #e6e6e6);
    --brand: var(--figma-color-bg-brand, #0d99ff);
    --brand-text: var(--figma-color-text-onbrand, #ffffff);
  }

  * { box-sizing: border-box; }

  /* .panel-body sets display:flex, which would otherwise override [hidden]. */
  [hidden] { display: none !important; }

  /* Figma adds figma-dark to <html>. Let native form controls follow it. */
  html.figma-dark { color-scheme: dark; }
  input { accent-color: var(--brand); }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 11px/1.45 "Inter", -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { padding: 12px; display: flex; flex-direction: column; gap: 10px; }

  .panel {
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    background: var(--bg);
  }

  .panel-head {
    padding: 7px 12px;
    background: var(--bg-soft);
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.01em;
  }

  .panel-body { padding: 12px; display: flex; flex-direction: column; gap: 10px; }

  .lead { margin: 0; font-size: 12px; line-height: 1.5; color: var(--text); }

  .stat { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  .stat .of { color: var(--text-2); font-size: 12px; font-weight: 500; letter-spacing: 0; }

  button, select {
    font: inherit;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
  }
  button { cursor: pointer; padding: 7px 10px; }
  button:hover { background: var(--bg-hover); }

  button.primary {
    background: var(--brand);
    border-color: var(--brand);
    color: var(--brand-text);
    font-weight: 600;
    padding: 9px 12px;
  }
  button.primary:hover { filter: brightness(0.94); }

  .btn-row { display: flex; gap: 6px; }
  .btn-row button { flex: 1; }

  .field { display: flex; align-items: center; gap: 7px; cursor: pointer; }
  .field input { margin: 0; flex: none; }
  .field span { flex: 1; }

  .group { display: flex; flex-direction: column; gap: 7px; }

  ul.bullets { margin: 0; padding: 0; list-style: none; color: var(--text-2); }
  ul.bullets li { position: relative; padding-left: 12px; margin-bottom: 5px; }
  ul.bullets li:last-child { margin-bottom: 0; }
  ul.bullets li::before { content: "•"; position: absolute; left: 0; }
  ul.bullets b { color: var(--text); font-weight: 600; }

  details.panel > summary {
    list-style: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  details.panel > summary::-webkit-details-marker { display: none; }
  details.panel > summary::after {
    content: "";
    width: 6px; height: 6px; margin-left: 8px;
    border-right: 1.5px solid var(--text-2);
    border-bottom: 1.5px solid var(--text-2);
    transform: translateY(-2px) rotate(45deg);
  }
  details.panel[open] > summary::after { transform: translateY(1px) rotate(-135deg); }

  ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: step; color: var(--text-2); }
  ol.steps li { counter-increment: step; position: relative; padding-left: 16px; margin-bottom: 5px; }
  ol.steps li:last-child { margin-bottom: 0; }
  ol.steps li::before { content: counter(step) "."; position: absolute; left: 0; }
  ol.steps b { color: var(--text); font-weight: 600; }

  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10px; padding: 1px 4px; border-radius: 3px;
    background: var(--bg-soft); color: var(--text); white-space: nowrap;
  }

  #toast {
    position: fixed; left: 12px; right: 12px; bottom: 12px;
    padding: 8px 10px; border-radius: 5px;
    background: var(--text); color: var(--bg);
    opacity: 0; transform: translateY(4px);
    transition: opacity .15s, transform .15s;
    pointer-events: none;
  }
  #toast.on { opacity: 1; transform: none; }

  .sr { position: absolute; left: -9999px; }

  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px; }
  .row label { font-weight: 600; }
  .row select { padding: 5px 6px; }

  .links { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 14px; padding: 0 2px 2px; }
  .link {
    border: 0; border-radius: 0; background: none; padding: 2px 0;
    color: var(--text-2); cursor: pointer;
  }
  .link:hover { background: none; color: var(--text); text-decoration: underline; }
  .link.static, .link.static:hover { cursor: default; color: var(--text-2); text-decoration: none; }
</style>

<div class="wrap">

  <section class="panel">
    <div class="panel-head">Frame Name Control</div>
    <div class="panel-body">
      <p class="lead" data-i18n="lead"></p>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head" data-i18n="statusTitle"></div>
    <div class="panel-body">
      <p class="stat"><span id="stat-hidden">0</span><span class="of" id="stat-of"></span></p>
      <button class="primary" id="btn-toggle"></button>
      <div class="btn-row">
        <button data-cmd="hide" data-i18n="hide"></button>
        <button data-cmd="show" data-i18n="show"></button>
        <button data-cmd="restore-all" data-i18n="restoreAll"></button>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head" data-i18n="scopeTitle"></div>
    <div class="panel-body">
      <div class="group">
        <label class="field"><input type="radio" name="scope" value="page"><span data-i18n="scopePage"></span></label>
        <label class="field"><input type="radio" name="scope" value="document"><span data-i18n="scopeDocument"></span></label>
        <label class="field"><input type="radio" name="scope" value="selection"><span data-i18n="scopeSelection"></span></label>
      </div>
    </div>
  </section>

  <details class="panel" id="panel-shortcut">
    <summary class="panel-head" data-i18n="shortcutTitle"></summary>
    <div class="panel-body" id="shortcut-mac">
      <p class="hint" data-i18n-html="shortcutIntro"></p>
      <ol class="steps">
        <li data-i18n-html="step1"></li>
        <li data-i18n-html="step2"></li>
        <li data-i18n-html="step3"></li>
        <li data-i18n-html="step4"></li>
        <li data-i18n-html="step5"></li>
      </ol>
      <button id="btn-copy-title" data-i18n="copyTitle"></button>
      <p class="hint" data-i18n-html="shortcutOther"></p>
    </div>
    <div class="panel-body" id="shortcut-windows" hidden>
      <p class="hint" data-i18n-html="shortcutWindows"></p>
    </div>
  </details>

  <details class="panel" id="panel-how">
    <summary class="panel-head" data-i18n="howTitle"></summary>
    <div class="panel-body">
      <ul class="bullets">
        <li data-i18n-html="how1"></li>
        <li id="how2"></li>
      </ul>
    </div>
  </details>

  <details class="panel" id="panel-note">
    <summary class="panel-head" data-i18n="noteTitle"></summary>
    <div class="panel-body">
      <ul class="bullets">
        <li data-i18n-html="note1"></li>
        <li data-i18n-html="note2"></li>
        <li data-i18n-html="note3"></li>
      </ul>
    </div>
  </details>

  <section class="panel">
    <div class="row">
      <label for="language" data-i18n="languageTitle"></label>
      <select id="language">
        <option value="auto" data-i18n="languageAuto"></option>
        <option value="en">English</option>
        <option value="ko">한국어</option>
      </select>
    </div>
  </section>

  <nav class="links">
    <button class="link" data-open="feedback" data-i18n="linkFeedback"></button>
    <button class="link" data-open="github">GitHub</button>
    <button class="link" id="link-author" data-open="linkedin" data-i18n="madeBy"></button>
  </nav>

</div>

<div id="toast"></div>
<textarea class="sr" id="clip"></textarea>

<script>
  var IS_MAC = /Mac/i.test(navigator.platform || navigator.userAgent);

  var TEXT = {
    en: {
      lead: 'Hide the name labels on your canvas, then bring them back with one click.',
      statusTitle: 'Status',
      hiddenOf: function (total, where) { return ' / ' + total + ' hidden · ' + where; },
      showNames: 'Show frame names',
      hideNames: 'Hide frame names',
      hide: 'Hide',
      show: 'Restore',
      restoreAll: 'Restore all',
      scopeTitle: 'Scope',
      scopePage: 'This page',
      scopeDocument: 'All pages',
      scopeSelection: 'Selected layers',
      howTitle: 'How it works',
      how1: 'Figma has no switch for canvas labels, so the plugin <b>temporarily renames</b> frames to an invisible character.',
      how2: function (undo) {
        return 'The original names are saved in the file. <b>Click the button again</b>, choose <b>Restore all</b>, or press <b>' + undo + '</b> to bring them back.';
      },
      noteTitle: 'Good to know',
      note1: 'Names also look blank in the Layers panel, and people viewing the same file see the change.',
      note2: 'Only frames that show a name on the canvas change. Sections, components, and frames inside other frames or groups keep their names.',
      note3: 'After the first use in a file, a <b>Hide/Show Frame Name</b> button appears in the right panel when nothing is selected or when you select one of those frames.',
      shortcutTitle: 'Keyboard shortcut',
      shortcutIntro: 'Figma can\'t set shortcuts, but macOS can. It takes a minute, once per computer. After that <b>⌥⌘F</b> hides and shows names from anywhere.',
      step1: 'Open <b>System Settings → Keyboard</b>, then click <b>Keyboard Shortcuts…</b>',
      step2: 'Pick <b>App Shortcuts</b> on the left, then click <b>+</b>.',
      step3: 'Choose <b>Figma</b>, and paste <code>Toggle Frame Names</code> as the menu title.',
      step4: 'Click the shortcut field, press <b>⌥⌘F</b>, then click <b>Done</b>.',
      step5: 'Quit Figma with <b>⌘Q</b> and open it again.',
      copyTitle: 'Copy menu title',
      shortcutOther: 'Any combination works as long as it includes <b>⌘</b> and Figma doesn\'t use it. ⌘F and ⇧⌘F are taken.',
      shortcutWindows: 'Shortcuts for menu items are a macOS feature. On Windows, use the button in the right panel.',
      toastCopied: 'Copied',
      toastCopyFailed: 'Couldn\'t copy. Select the text instead.',
      languageTitle: 'Language',
      languageAuto: 'Auto',
      linkFeedback: 'Send feedback',
      madeBy: 'Made by Belle Kim'
    },
    ko: {
      lead: '캔버스의 이름 라벨을 숨기고, 클릭 한 번으로 다시 켭니다.',
      statusTitle: '현재 상태',
      hiddenOf: function (total, where) { return ' / ' + total + ' 숨김 · ' + where; },
      showNames: '이름 다시 보이기',
      hideNames: '이름 숨기기',
      hide: '숨기기',
      show: '복구',
      restoreAll: '전체 복구',
      scopeTitle: '적용 범위',
      scopePage: '이 페이지',
      scopeDocument: '모든 페이지',
      scopeSelection: '선택한 레이어',
      howTitle: '동작 방식',
      how1: 'Figma에는 캔버스 라벨을 끄는 기능이 없어서, 프레임 이름을 <b>잠시 보이지 않는 문자로 바꿉니다</b>.',
      how2: function (undo) {
        return '원래 이름은 파일에 저장됩니다. <b>버튼을 다시 누르거나</b> <b>전체 복구</b>를 누르거나 <b>' + undo + '</b>를 누르면 돌아옵니다.';
      },
      noteTitle: '알아 두세요',
      note1: '레이어 패널에서도 이름이 비어 보이고, 같은 파일을 보는 사람에게도 바뀐 이름이 보입니다.',
      note2: '캔버스에 이름이 보이는 프레임만 바꿉니다. 섹션, 컴포넌트, 다른 프레임이나 그룹 안의 프레임은 이름을 그대로 둡니다.',
      note3: '파일에서 한 번 쓰고 나면, 아무것도 선택하지 않았거나 이 프레임들을 선택했을 때 오른쪽 패널에 <b>Hide/Show Frame Name</b> 버튼이 생깁니다.',
      shortcutTitle: '단축키',
      shortcutIntro: 'Figma는 단축키를 정할 수 없지만 macOS로는 됩니다. 컴퓨터마다 한 번, 1분이면 끝납니다. 그다음부터는 <b>⌥⌘F</b>로 어디서든 이름을 켜고 끕니다.',
      step1: '<b>시스템 설정 → 키보드</b>를 열고 <b>키보드 단축키…</b>를 누릅니다.',
      step2: '왼쪽에서 <b>앱 단축키</b>를 고르고 <b>+</b>를 누릅니다.',
      step3: '응용 프로그램에서 <b>Figma</b>를 고른 뒤, 메뉴 제목에 <code>Toggle Frame Names</code>를 붙여 넣습니다.',
      step4: '키보드 단축키 칸을 누르고 <b>⌥⌘F</b>를 누른 다음 <b>완료</b>를 누릅니다.',
      step5: 'Figma를 <b>⌘Q</b>로 종료했다가 다시 엽니다.',
      copyTitle: '메뉴 제목 복사',
      shortcutOther: '<b>⌘</b>가 들어가고 Figma가 쓰지 않는 조합이면 무엇이든 됩니다. ⌘F와 ⇧⌘F는 이미 쓰입니다.',
      shortcutWindows: '메뉴 항목에 단축키를 붙이는 것은 macOS 기능입니다. Windows에서는 오른쪽 패널 버튼을 쓰세요.',
      toastCopied: '복사했습니다',
      toastCopyFailed: '복사하지 못했습니다. 직접 선택해 주세요.',
      languageTitle: '언어',
      languageAuto: '자동',
      linkFeedback: '피드백 보내기',
      madeBy: 'Made by Belle Kim'
    }
  };

  var MENU_TITLE = 'Toggle Frame Names';
  var language = 'en';
  var settings = null;
  var links = { linkedin: false };
  var lastHeight = 0;
  var firstRender = true;

  var $ = function (id) { return document.getElementById(id); };
  var t = function () { return TEXT[language] || TEXT.en; };
  var post = function (msg) { parent.postMessage({ pluginMessage: msg }, '*'); };

  function save() {
    post({ type: 'settings', settings: settings });
  }

  /* -------------------------------------------------------------- controls */

  document.querySelectorAll('input[name="scope"]').forEach(function (el) {
    el.addEventListener('change', function () { settings.scope = el.value; save(); });
  });

  $('language').addEventListener('change', function () {
    settings.language = $('language').value;
    save();
  });

  $('btn-toggle').addEventListener('click', function () { post({ type: 'run', command: 'toggle' }); });
  document.querySelectorAll('button[data-cmd]').forEach(function (el) {
    el.addEventListener('click', function () { post({ type: 'run', command: el.dataset.cmd }); });
  });

  document.querySelectorAll('[data-open]').forEach(function (el) {
    el.addEventListener('click', function () {
      if (el.classList.contains('static')) return;
      post({ type: 'open', link: el.dataset.open });
    });
  });

  /* ------------------------------------------------------------------ copy */

  var toastTimer = null;
  function toast(text) {
    var el = $('toast');
    el.textContent = text;
    el.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('on'); }, 2200);
  }

  $('btn-copy-title').addEventListener('click', function () {
    var clip = $('clip');
    clip.value = MENU_TITLE;
    clip.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
    clip.blur();
    toast(ok ? t().toastCopied : t().toastCopyFailed);
  });

  /* ----------------------------------------------------------------- sync */

  function applyText() {
    document.documentElement.lang = language;
    document.querySelectorAll('[data-i18n]').forEach(function (el) {
      el.textContent = t()[el.dataset.i18n];
    });
    document.querySelectorAll('[data-i18n-html]').forEach(function (el) {
      el.innerHTML = t()[el.dataset.i18nHtml];
    });
  }

  // Fit the window to the content. The plugin caps the height.
  function fitWindow() {
    requestAnimationFrame(function () {
      var height = document.body.scrollHeight;
      if (Math.abs(height - lastHeight) > 4) {
        lastHeight = height;
        post({ type: 'resize', height: height });
      }
    });
  }

  function render(state) {
    settings = state.settings;
    language = TEXT[state.language] ? state.language : 'en';
    links = state.links || links;
    applyText();

    var where = settings.scope === 'document' ? t().scopeDocument
              : settings.scope === 'selection' ? t().scopeSelection : t().scopePage;
    $('stat-hidden').textContent = state.status.hidden;
    $('stat-of').textContent = t().hiddenOf(state.status.total, where);
    $('btn-toggle').textContent = state.status.hidden > 0 ? t().showNames : t().hideNames;
    $('how2').innerHTML = t().how2(IS_MAC ? '⌘Z' : 'Ctrl+Z');

    $('shortcut-mac').hidden = !IS_MAC;
    $('shortcut-windows').hidden = IS_MAC;

    // The first run explains itself; after that the window stays short.
    if (firstRender) {
      $('panel-how').open = !settings.onboarded;
      $('panel-note').open = !settings.onboarded;
      firstRender = false;
    }

    var scopeInput = document.querySelector('input[name="scope"][value="' + settings.scope + '"]');
    if (scopeInput) scopeInput.checked = true;
    $('language').value = settings.language || 'auto';
    $('link-author').classList.toggle('static', !links.linkedin);

    fitWindow();
  }

  document.querySelectorAll('details.panel').forEach(function (panel) {
    panel.addEventListener('toggle', fitWindow);
  });

  onmessage = function (event) {
    var msg = event.data && event.data.pluginMessage;
    if (msg && msg.type === 'state') render(msg);
  };

  post({ type: 'ready', language: navigator.language });
</script>
